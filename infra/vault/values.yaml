# Vault Helm values — persistent single-node local-cluster-1 Vault
# Chart: hashicorp/vault 0.33.0
# Reference: infra/vault/default.values.yaml

injector:
  # The relay workers opt in through pod-template annotations. The injector
  # authenticates them through their Kubernetes service accounts and writes
  # short-lived Vault tokens only to an in-memory shared volume.
  enabled: true

server:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # This is deliberately a single replica: it provides persistent state for
  # local encryption testing, not high availability.
  dev:
    enabled: false

  standalone:
    enabled: true
    config: |-
      ui = true
      plugin_directory = "/usr/local/libexec/vault"

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

  dataStorage:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce

  # Keep the local Vault state if the StatefulSet is recreated or the Helm app
  # is temporarily removed. The k3d local-path provisioner persists it under
  # ~/k3d-data/local-cluster-1 on the host.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  volumes:
    - name: plugins
      emptyDir: {}

  volumeMounts:
    - name: plugins
      mountPath: /usr/local/libexec/vault

  extraInitContainers:
    - name: vault-plugin-secrets-jwt
      image: quay.io/curl/curl:8.20.0
      command:
        - /bin/sh
        - -ec
      args:
        - |
          set -euo pipefail

          VERSION="1.0.0-beta.5"

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ASSET="vault-plugin-secrets-jwt_${VERSION}_linux_amd64" ;;
            aarch64|arm64) ASSET="vault-plugin-secrets-jwt_${VERSION}_linux_arm64" ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac

          cd /usr/local/libexec/vault
          curl -fsSL "https://github.com/outfoxx/vault-plugin-secrets-jwt/releases/download/v${VERSION}/${ASSET}" -o vault-plugin-secrets-jwt
          chmod 0755 vault-plugin-secrets-jwt
      volumeMounts:
        - name: plugins
          mountPath: /usr/local/libexec/vault

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - host: vault.local
        paths:
          - /

ui:
  enabled: true
