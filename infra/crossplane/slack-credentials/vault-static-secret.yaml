# Syncs Vault KV v1 mount "v1", path "slack" to a Kubernetes Secret. The
# source key is intentionally preserved as slack_operator; no secret value is
# stored in this repository.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: slack-operator-token
  namespace: crossplane-system
spec:
  vaultAuthRef: slack-vault-auth
  mount: v1
  path: slack
  type: kv-v1
  refreshAfter: 1h
  destination:
    create: true
    name: slack-creds
