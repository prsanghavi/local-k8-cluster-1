# Syncs Vault KV v2 mount "kv", path "v1/slack" to a Kubernetes Secret. The
# source key is intentionally preserved as slack_operator; no secret value is
# stored in this repository.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: slack-operator-token
  namespace: crossplane-system
spec:
  vaultAuthRef: slack-vault-auth
  mount: kv
  path: v1/slack
  type: kv-v2
  refreshAfter: 1h
  destination:
    create: true
    name: slack-creds
