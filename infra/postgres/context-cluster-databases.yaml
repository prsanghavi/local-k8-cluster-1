# CNPG Database CR for the context-cluster file provider.
# CNPG creates this database and grants context_cluster_file_user ownership.
# Requires the context_cluster_file_user role to exist (managed in cluster.yaml).
#
# Before syncing this, create the credentials secret:
#   ./infra/scripts/infra-setup/secrets-auto-setup-scripts/setup-context-cluster-secret.sh
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: context-cluster-file-db
  namespace: postgres
spec:
  name: context_cluster_file_db
  owner: context_cluster_file_user
  cluster:
    name: postgres-cluster-1
