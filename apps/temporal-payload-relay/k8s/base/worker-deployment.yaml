apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-payload-relay
  labels:
    app: temporal-payload-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-payload-relay
  template:
    metadata:
      labels:
        app: temporal-payload-relay
      annotations:
        # Bump this revision to deliberately recreate worker pods after a Vault
        # injector configuration change. Admission only mutates pods at creation.
        vault.hashicorp.com/agent-inject-revision: "3"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-cache-use-auto-auth-token: "force"
        vault.hashicorp.com/agent-cache-listener-port: "8200"
        vault.hashicorp.com/role: replace-me
        vault.hashicorp.com/service: http://vault.vault.svc.cluster.local:8200
    spec:
      serviceAccountName: temporal-payload-relay
      volumes:
        - name: nexus-encryption-policy
          configMap:
            name: temporal-payload-relay-nexus-encryption-policy
      containers:
        - name: temporal-payload-relay
          image: k3d-registry:5000/temporal-payload-relay:local-20260819171727
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          env:
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: replace-me
            - name: TEMPORAL_TASK_QUEUE
              value: replace-me
            - name: TEMPORAL_WORKER_IDENTITY
              value: replace-me
            - name: ENABLE_PAYLOAD_ENCRYPTION
              value: "true"
            - name: VAULT_TRANSIT_MOUNT
              value: transit
            - name: VAULT_TRANSIT_KEY
              value: temporal-payload-relay
            - name: NEXUS_ENCRYPTION_CAPABILITIES_PATH
              value: /etc/temporal-security/capabilities.json
          volumeMounts:
            - name: nexus-encryption-policy
              mountPath: /etc/temporal-security
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
