apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ob1-tf-eks-de-v2-comms-ns-1
resources:
  - ../base
patches:
  - target:
      kind: WorkerDeployment
      name: temporal-payload-relay
    patch: |-
      - op: replace
        path: /spec/workerOptions/temporalNamespace
        value: ob1-temporal-comms-cluster-1-ns-1
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ob1-temporal-comms-cluster-1-ns-1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: ob1-comms-nexus-queue-1
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: temporal-payload-relay-comms
