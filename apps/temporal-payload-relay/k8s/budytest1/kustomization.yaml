apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uo-bpo1-de-v2-budy-gilfoyle-ns-1
configMapGenerator:
  - name: temporal-payload-relay-nexus-encryption-routes
    files:
      - routes.json=routes.json
resources:
  - ../base
patches:
  - target:
      kind: Deployment
      name: temporal-payload-relay
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ob1-uo-temporal-budytest1-ns-1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: ob1-budytest1-nexus-queue-1
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: temporal-payload-relay-budytest1
      - op: replace
        path: /spec/template/spec/containers/0/env/13/value
        value: ob1-uo-temporal-budytest1-ns-1
      - op: replace
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1role
        value: temporal-payload-relay-budytest1
