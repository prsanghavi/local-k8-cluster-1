apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-slack-credentials
  namespace: argocd
  annotations:
    # Vault Secrets Operator and the Slack provider CRDs must exist first.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: infra/crossplane/slack-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
