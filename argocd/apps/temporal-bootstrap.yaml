apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-bootstrap
  namespace: argocd
  annotations:
    # After the Temporal server application (wave 4).
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: infra/temporal-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
