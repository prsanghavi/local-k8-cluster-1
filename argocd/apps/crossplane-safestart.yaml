apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-safestart
  namespace: argocd
  annotations:
    # Crossplane must be installed before its activation-policy CRD is available.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: infra/crossplane/safestart
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
