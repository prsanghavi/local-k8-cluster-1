apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-payload-relay-hawthorn-hope
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: apps/temporal-payload-relay/k8s/hawthorn-hope
  destination:
    server: https://kubernetes.default.svc
    namespace: uo-bpo1-de-v2-hwhrn-hope-ns-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
