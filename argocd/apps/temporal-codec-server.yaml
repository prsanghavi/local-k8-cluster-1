apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-codec-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: apps/temporal-codec-server/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
