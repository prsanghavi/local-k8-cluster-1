apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-opentofu-slack
  namespace: argocd
  annotations:
    # The OpenTofu provider CRDs and Vault-synced slack-creds Secret must exist.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prsanghavi/local-k8-cluster-1
    targetRevision: HEAD
    path: infra/crossplane/opentofu-slack
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
